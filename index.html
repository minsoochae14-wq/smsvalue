<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문자혜택</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="문자혜택">
<meta property="og:title" content="문자혜택 - 받은 광고문자 속 혜택 모아보기">
<meta property="og:description" content="묻혀 있던 광고 문자 속 할인·쿠폰을 AI가 정리해드려요">
<meta property="og:url" content="https://minsoochae14-wq.github.io/smsvalue/">
<meta property="og:image" content="https://minsoochae14-wq.github.io/smsvalue/og-image-v1.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F2F4F6;--card:#fff;--card-line:transparent;--card-shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.06);--fill:#F2F4F6;--fill-soft:#F5F6F8;--tag:#EEF0F3;--tag-text:#8B95A1;--paste:#F9FAFB}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg)}
.app{width:100%;max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.notice-banner{background:#FFF8E1;border-bottom:0.5px solid rgba(0,0,0,.05);padding:8px 16px;font-size:12px;color:#8A6D1A;text-align:center;line-height:1.5}
.notice-banner b{color:#5C4708;font-weight:600}
.topbar{background:#fff;border-bottom:0.5px solid rgba(0,0,0,.07);padding:52px 16px 10px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:18px;font-weight:700;color:#111}
.logo span{color:#1D9E75}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:10px 14px 10px 36px;font-size:16px;border:0.5px solid rgba(0,0,0,.1);border-radius:24px;background:var(--fill-soft);color:#111;outline:none}
.search-wrap input::placeholder{color:#bbb}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#bbb}
.filter-row{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:0.5px solid rgba(0,0,0,.06)}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;border:0.5px solid rgba(0,0,0,.1);background:#fff;color:#777;cursor:pointer}
.chip.on{background:#E1F5EE;color:#085041;border-color:#5DCAA5}
.scroll-area{flex:1;overflow-y:auto;padding-bottom:90px}
.list-wrap{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bcard{background:var(--card);border:0.5px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:16px;padding:16px;cursor:pointer}
.bcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bbadge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:#E1F5EE;color:#085041}
.catbadge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--fill);color:#4E5968}
.rank-badge{position:absolute;top:-1px;left:12px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:0 0 6px 6px}
.r1{background:#FAEEDA;color:#633806}.r2{background:#EEF0F3;color:#4E5968}.r3{background:#FAECE7;color:#712B13}
.brand-inline{font-weight:600;color:#111}
.summary-inline{color:#666;font-weight:400}
.sort-tabs{display:flex;background:#fff;border-bottom:0.5px solid rgba(0,0,0,.07);flex-shrink:0}
.stab{flex:1;padding:10px 4px;font-size:12px;font-weight:500;color:#aaa;text-align:center;border-bottom:2px solid transparent;cursor:pointer;transition:all .12s}
.stab.on{color:#1D9E75;border-bottom-color:#1D9E75}
.hot-count{font-size:12px;font-weight:600;color:#D85A30;display:flex;align-items:center;gap:3px}
.view-count{font-size:12px;font-weight:500;color:#534AB7;display:flex;align-items:center;gap:3px}
.count-wrap{display:flex;align-items:center;gap:8px}
.tbadge{position:absolute;top:10px;right:12px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px}
.tbadge-txt{font-size:10px;font-weight:600}
.th{background:#D1F0E0;color:#1A7A4A}
.tm{background:#FAEEDA;color:#7A4A00}
.tl{background:#FFE0E0;color:#A32D2D}
.bcard-title{font-size:15px;font-weight:500;color:#111;margin-bottom:10px;line-height:1.4}
.bcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meta{font-size:12px;color:#aaa;display:flex;align-items:center;gap:4px}
.dday{font-size:12px;font-weight:700;color:#E24B4A;margin-left:auto}
.bcard.expired{opacity:.55}
.bcard-main{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.bcard-body{flex:1;min-width:0}
.perk{flex-shrink:0;width:64px;min-height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:6px 2px}
.perk b{font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.5px;word-break:keep-all}
.perk b.sm{font-size:14px}
.perk span{font-size:11px;font-weight:600}
.perk i{font-size:24px}
.perk.pct{background:#FDEEE8;color:#C2410C}
.perk.won{background:#E1F5EE;color:#0B6B4D}
.perk.plus{background:#FCE7F3;color:#A21C5B}
.perk.free{background:#E6F0FD;color:#1D4ED8}
.perk.none{background:var(--fill);color:#aaa}
.sec-head{display:flex;align-items:baseline;gap:6px;margin:6px 2px 0}
.sec-head:first-child{margin-top:0}
.sec-title{font-size:15px;font-weight:700;color:#111}
.sec-cnt{font-size:13px;font-weight:700;color:#1D9E75}
.sec-sub{font-size:12px;color:#aaa;margin-left:auto}
.sec-head.hot .sec-cnt{color:#E24B4A}
.exp-toggle{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;padding:12px;border-radius:12px;border:0.5px dashed rgba(0,0,0,.15);background:transparent;font-size:13px;font-weight:500;color:#888;cursor:pointer;width:100%}
.exp-toggle i{font-size:15px}
.chip .cnt{margin-left:4px;font-weight:700;opacity:.6}
.list-note{text-align:center;font-size:13px;color:#aaa;padding:14px 0 4px;line-height:1.6}
.ended{font-size:12px;font-weight:700;color:#999;margin-left:auto}
.nodate-tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--tag);color:var(--tag-text)}
.sec-head.nodate .sec-cnt{color:#999}
.empty-state{text-align:center;padding:60px 20px;color:#bbb}
.empty-state i{font-size:40px;margin-bottom:12px;display:block}
.empty-state p{font-size:14px;line-height:1.6}
.fab{position:fixed;bottom:80px;right:16px;width:54px;height:54px;border-radius:50%;background:#1D9E75;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:50;box-shadow:0 4px 16px rgba(29,158,117,.35)}
@media(min-width:430px){.fab{right:calc(50% - 199px)}}
.fab i{font-size:24px;color:#fff;pointer-events:none}
.bottom-nav{background:#fff;border-top:0.5px solid rgba(0,0,0,.08);display:flex;padding:8px 0 24px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:40}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.nav-item i{font-size:22px;color:#ccc;pointer-events:none}
.nav-item span{font-size:10px;color:#ccc;pointer-events:none}
.nav-item.on i,.nav-item.on span{color:#1D9E75}
.nav-item.on span{font-weight:600}
.detail-screen{position:fixed;top:0;left:50%;transform:translateX(-50%) translateX(100%);width:100%;max-width:430px;height:100vh;background:#fff;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:60;display:flex;flex-direction:column}
.detail-screen.open{transform:translateX(-50%) translateX(0)}
.detail-nav{padding:52px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:0.5px solid rgba(0,0,0,.08)}
.back-btn{width:34px;height:34px;border-radius:50%;background:var(--fill-soft);border:0.5px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn i{pointer-events:none}
.detail-scroll{flex:1;overflow-y:auto;padding:18px 16px 0}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand-ico{width:44px;height:44px;border-radius:12px;background:#E1F5EE;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#085041;flex-shrink:0}
.brand-name{font-size:16px;font-weight:700;color:#111}
.brand-cat{font-size:13px;color:#999;margin-top:2px}
.sms-box{background:var(--fill-soft);border-radius:14px;padding:16px;margin-bottom:16px}
.sms-lbl{font-size:11px;font-weight:700;color:#aaa;margin-bottom:8px;letter-spacing:.04em}
.sms-text{font-size:14px;color:#111;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.info-cell{background:var(--fill-soft);border-radius:12px;padding:12px}
.info-lbl{font-size:11px;color:#aaa;margin-bottom:4px;font-weight:500}
.info-val{font-size:15px;font-weight:700;color:#111}
.trust-wrap{margin-bottom:16px}
.trust-row{display:flex;justify-content:space-between;margin-bottom:7px}
.trust-bar-bg{height:7px;background:var(--fill);border-radius:4px;overflow:hidden}
.trust-fill{height:100%;border-radius:4px}
.dup-row{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--fill-soft);border-radius:12px;margin-bottom:20px}
.links-box{margin-bottom:20px}
.se-box{margin-bottom:20px}
.se-head{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.se-title{font-size:14px;font-weight:700;color:#111}
.se-cnt{font-size:13px;font-weight:700;color:#1D9E75}
.se-row{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:6px;background:var(--card);border:0.5px solid rgba(0,0,0,.1);border-radius:12px;cursor:pointer}
.se-row:active{background:var(--fill-soft)}
.se-txt{flex:1;min-width:0}
.se-sum{font-size:14px;font-weight:600;color:#111;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.se-meta{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12px;color:#999}
.se-meta span{display:flex;align-items:center;gap:3px}
.se-meta .se-got{color:#D85A30;font-weight:600}
.se-row .ti-chevron-right{font-size:16px;color:#ccc;flex-shrink:0}
.se-empty{padding:14px;border-radius:12px;background:var(--fill-soft);font-size:13px;line-height:1.6;color:#888}
.sheet-body .se-box{margin:6px 0 12px}
.save-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:-6px -6px -6px 0;border:none;background:transparent;border-radius:50%;cursor:pointer;flex-shrink:0}
.save-btn i{font-size:19px;color:#ccc;pointer-events:none}
.save-btn.on i{color:#EF9F27}
.save-btn:active{background:var(--fill)}
.app.view-list .search-wrap,.app.view-list #sortTabs,.app.view-list #filterRow{display:none!important}
.links-head{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.links-title{font-size:14px;font-weight:700;color:#111}
.links-cnt{font-size:13px;font-weight:700;color:#1D9E75}
.link-row{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:6px;background:#fff;border:0.5px solid rgba(0,0,0,.1);border-radius:12px;text-decoration:none;color:inherit}
.link-row:active{background:var(--fill-soft)}
.link-row .ti-link{font-size:16px;color:#1D9E75;flex-shrink:0}
.link-txt{flex:1;min-width:0}
.link-host{display:block;font-size:13px;font-weight:600;color:#111}
.link-url{display:block;font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-row .ti-external-link{font-size:15px;color:#bbb;flex-shrink:0}
.links-warn{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.5;color:#999;margin-top:8px}
.links-warn i{font-size:14px;margin-top:1px}
.links-warn.bad{padding:10px 12px;border-radius:10px;background:#FFE0E0;color:#A32D2D}
.dup-cnt{font-size:14px;font-weight:700;color:#1D9E75}
.dup-txt{font-size:14px;color:#666}
.detail-actions{padding:14px 16px 34px;border-top:0.5px solid rgba(0,0,0,.08);display:flex;gap:8px;background:#fff}
.btn-sec{flex:1;padding:14px;font-size:15px;border-radius:14px;border:0.5px solid rgba(0,0,0,.12);background:#fff;color:#111;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sec i{pointer-events:none}
.btn-pri{flex:1;padding:14px;font-size:15px;font-weight:700;border-radius:14px;background:#1D9E75;color:#fff;border:none;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:none}
.overlay.open{display:block}
.sheet-body{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:22px 16px 40px;z-index:80;display:none;max-height:90vh;overflow-y:auto}
.sheet-body.open{display:block}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 20px}
.sheet-title{font-size:18px;font-weight:700;color:#111;margin-bottom:5px}
.sheet-sub{font-size:14px;color:#aaa;margin-bottom:20px}
.paste-area{width:100%;min-height:120px;border:1.5px dashed #D1D6DB;border-radius:16px;background:var(--paste);padding:16px;margin-bottom:16px;cursor:text}
.paste-area:focus-within{border-color:#1D9E75;background:#fff}
.paste-area textarea{width:100%;background:transparent;border:none;outline:none;font-size:16px;color:#111;line-height:1.65;resize:none;min-height:90px;font-family:inherit}
.paste-area textarea::placeholder{color:#ccc}
.analyzing{display:none;align-items:center;gap:12px;padding:14px 16px;background:var(--fill-soft);border-radius:14px;margin-bottom:16px}
.analyzing.show{display:flex}
.dot-spin{width:20px;height:20px;border:2px solid #9FE1CB;border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.result-card{display:none;border:0.5px solid rgba(0,0,0,.08);border-radius:16px;overflow:hidden;margin-bottom:12px}
.result-card.show{display:block}
.result-header{background:#E1F5EE;padding:12px 16px;display:flex;align-items:center;gap:8px}
.result-header i{font-size:17px;color:#085041;pointer-events:none}
.result-header span{font-size:14px;font-weight:700;color:#085041}
.result-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.result-row{display:flex;align-items:center;justify-content:space-between}
.result-lbl{font-size:13px;color:#aaa;display:flex;align-items:center;gap:6px}
.result-lbl i{font-size:14px;pointer-events:none}
.result-val{font-size:14px;font-weight:600;color:#111}
.result-divider{height:0.5px;background:var(--fill)}
.pii-note{display:flex;gap:6px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:10px;background:#E1F5EE;color:#085041;font-size:12px;line-height:1.5}
.pii-note i{font-size:15px;margin-top:1px}
.trust-mini{display:flex;align-items:center;gap:10px}
.tbar{flex:1;height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.tfill{height:100%;border-radius:3px}
.submit-ok{width:100%;padding:16px;font-size:16px;font-weight:700;border-radius:16px;background:#1D9E75;color:#fff;border:none;cursor:pointer;margin-top:6px}
.submit-ok:disabled{opacity:.35;cursor:not-allowed}
.loc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none}
.loc-overlay.open{display:block}
.loc-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface-2, #fff);border-radius:24px 24px 0 0;padding:20px 16px 90px;z-index:36;display:none;max-height:80vh;overflow-y:auto}
.loc-sheet.open{display:block}
.loc-sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong,#ddd);margin:0 auto 16px}
.loc-sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.loc-sheet-title{font-size:16px;font-weight:500;color:var(--text-primary,#111)}
.loc-reset{font-size:12px;color:var(--text-muted,#aaa);cursor:pointer}
.loc-step-tabs{display:flex;border-bottom:0.5px solid var(--border,rgba(0,0,0,.1));margin-bottom:14px}
.loc-stab{flex:1;padding:8px 4px;font-size:13px;font-weight:500;color:var(--text-muted,#aaa);text-align:center;border-bottom:2px solid transparent;cursor:pointer}
.loc-stab.on{color:#1D9E75;border-bottom-color:#1D9E75}
.loc-stab.done{color:var(--text-secondary,#666)}
.loc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lchip{font-size:12px;padding:6px 12px;border-radius:20px;border:0.5px solid var(--border,rgba(0,0,0,.1));color:var(--text-secondary,#666);cursor:pointer;white-space:nowrap}
.lchip.on{background:#E1F5EE;color:#085041;border-color:#5DCAA5;font-weight:500}
.loc-apply{width:100%;padding:13px;font-size:14px;font-weight:500;border-radius:14px;background:#1D9E75;color:#fff;border:none;cursor:pointer}
.loc-tab{display:flex;align-items:center;gap:3px;padding:7px 8px;font-size:12px;font-weight:500;color:#1D9E75;white-space:nowrap;cursor:pointer;flex-shrink:0}
.loc-tab i{font-size:14px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:14px;padding:12px 20px;border-radius:12px;z-index:200;display:none;white-space:nowrap}
.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="notice-banner" id="noticeBanner">검증은 여러분의 몫... 대신 <b id="totalViews">0</b>명이 같이 봤어요</div>
  <div class="topbar" style="padding-top:14px">
    <div class="topbar-row">
      <div class="logo">문자혜택을 <span>올려주세요</span></div>
    </div>
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="searchInput" placeholder="브랜드명 검색...">
    </div>
  </div>
  <div class="sort-tabs" id="sortTabs" style="display:flex;align-items:center">
    <div class="stab on" data-sort="latest">최신순</div>
    <div class="stab" data-sort="popular">인기순</div>
    <div class="stab" data-sort="deadline">마감임박</div>
    <div class="loc-tab" id="locTabBtn"><i class="ti ti-map-pin" aria-hidden="true"></i><span id="locLabel">전국</span></div>
  </div>
  <div class="filter-row" id="filterRow">
    <span class="chip on" data-cat="전체">전체</span>
  </div>
  <div class="scroll-area">
    <div class="list-wrap" id="listWrap">
      <div class="empty-state"><i class="ti ti-loader"></i><p>불러오는 중...</p></div>
    </div>
  </div>
  <button class="fab" id="fabBtn"><i class="ti ti-plus"></i></button>
  <div class="bottom-nav">
    <div class="nav-item on" id="navHome"><i class="ti ti-home"></i><span>홈</span></div>
    <div class="nav-item" id="navSearch"><i class="ti ti-search"></i><span>탐색</span></div>
    <div class="nav-item" id="navSubmit"><i class="ti ti-circle-plus"></i><span>올리기</span></div>
    <div class="nav-item" id="navSaved"><i class="ti ti-star"></i><span>저장</span></div>
    <div class="nav-item" id="navMine"><i class="ti ti-user"></i><span>마이</span></div>
  </div>
</div>

<div class="detail-screen" id="detailScreen">
  <div class="detail-nav">
    <div class="back-btn" id="backBtn"><i class="ti ti-arrow-left" style="font-size:18px;color:#111"></i></div>
    <span style="font-size:16px;font-weight:700;color:#111" id="detailNavTitle">혜택 상세</span>
  </div>

  }

function fetchData() {
  db.from('sms_benefits')
    .select('*')
    .eq('status','approved')
    .order('created_at',{ascending:false})
    .then(function(res){
      if(res.error) {
        console.error('fetchData 오류:', res.error);
        document.getElementById('listWrap').innerHTML = '<div class="empty-state"><i class="ti ti-alert-circle"></i><p>데이터 로드 실패<br>' + esc(res.error.message) + '</p></div>';
        return;
      }
      if(res.data) {
        allItems = res.data;
        renderList();
        openDeepLink();
        // 전체 조회수 합계를 배너에 표시
        var totalV = 0;
        for(var i=0; i<allItems.length; i++) totalV += (allItems[i].view_count || 0);
        var tv = document.getElementById('totalViews');
        if(tv) tv.textContent = totalV.toLocaleString();
      }
    })
    .catch(function(e){
      console.error('네트워크 오류:', e);
      document.getElementById('listWrap').innerHTML = '<div class="empty-state"><i class="ti ti-wifi-off"></i><p>네트워크 오류<br>인터넷 연결을 확인해주세요</p></div>';
    });
}

function renderList() {
  if(currentView !== 'home') { renderSaved(); return; }
  var q = document.getElementById('searchInput').value.toLowerCase();
  var items = allItems.filter(function(d){
    if(q && !(d.brand||'').toLowerCase().includes(q)) return false;
    // 지역 필터
    if(currentCity && currentCity !== '전국') {
      var loc = (d.location || '').toLowerCase();
      if(currentDistrict) {
        if(!loc.includes(currentDistrict.toLowerCase())) return false;
      } else if(currentCity === '앱전용') {
        if(!loc.includes('앱')) return false;
      } else if(currentCity === '온라인') {
        if(!loc.includes('온라인')) return false;
      } else {
        if(!loc.includes(currentCity.toLowerCase()) && loc !== '전국') return false;
      }
    }
    return true;
  });

  renderChips(items);
  if(currentFilter !== '전체') {
    items = items.filter(function(d){ return normCat(d.category) === currentFilter; });
  }

  // 정렬
  if(currentSort === 'popular') {
    items = items.slice().sort(function(a,b){ return (b.submit_count||1)-(a.submit_count||1); });
  } else if(currentSort === 'deadline') {
    items = items.slice().sort(function(a,b){
      if(!hasEndDate(a)) return hasEndDate(b) ? 1 : 0;
      if(!hasEndDate(b)) return -1;
      return parseLocalDate(a.end_date)-parseLocalDate(b.end_date);
    });
  }
  // 진행 중 = 마감일이 있고 아직 안 지난 것 / 기간 미정 = 마감일 없음 / 마감 = 지난 것
  var expired = items.filter(function(d){ return isExpired(d.end_date); });
  var ongoing = items.filter(function(d){ return !isExpired(d.end_date) && hasEndDate(d); });
  var nodate = items.filter(function(d){ return !isExpired(d.end_date) && !hasEndDate(d); });

  var wrap = document.getElementById('listWrap');
  if(!items.length) {
    wrap.innerHTML = '<div class="empty-state"><i class="ti ti-inbox"></i><p>'+(allItems.length?'조건에 맞는 혜택이 없어요':'아직 등록된 혜택이 없어요<br>첫 번째로 문자를 올려보세요!')+'</p></div>';
    return;
  }

  var html = '';
  if(currentSort === 'latest') {
    // 7일 안에 끝나는 혜택은 따로 묶어서 맨 위에
    var soon = ongoing.filter(function(d){ var dd = calcDday(d.end_date); return dd !== null && dd <= 7; })
      .sort(function(a,b){ return parseLocalDate(a.end_date)-parseLocalDate(b.end_date); });
    var rest = ongoing.filter(function(d){ return soon.indexOf(d) < 0; });
    if(soon.length) html += secHead('🔥 곧 마감', soon.length, '7일 안에 끝나요', 'hot') + soon.map(function(d){ return cardHtml(d, -1); }).join('');
    if(rest.length) html += secHead('진행 중', rest.length, '최신순') + rest.map(function(d){ return cardHtml(d, -1); }).join('');
  } else if(ongoing.length) {
    html += secHead('진행 중', ongoing.length, currentSort === 'popular' ? '제출 많은 순' : '마감 빠른 순') +
      ongoing.map(function(d, idx){ return cardHtml(d, currentSort === 'popular' ? idx : -1); }).join('');
  }
  if(nodate.length) {
    html += secHead('기간 미정', nodate.length, currentSort === 'popular' ? '제출 많은 순' : '마감일이 없는 혜택', 'nodate') +
      nodate.map(function(d){ return cardHtml(d, -1); }).join('');
  }
  if(!ongoing.length && !nodate.length) {
    html += '<div class="list-note">지금 진행 중인 혜택이 없어요<br>받은 문자를 올려 주세요!</div>';
  }
  if(expired.length) {
    html += '<button class="exp-toggle" id="expToggle">'+(showExpired?'마감된 혜택 접기':'마감된 혜택 '+expired.length+'개 보기')+
      '<i class="ti ti-chevron-'+(showExpired?'up':'down')+'"></i></button>';
    if(showExpired) html += expired.map(function(d){ return cardHtml(d, -1); }).join('');
  }
  wrap.innerHTML = html;

  bindCards(wrap);
  var tg = document.getElementById('expToggle');
  if(tg) tg.addEventListener('click', function(){ showExpired = !showExpired; renderList(); });
}

function bindCards(root) {
  root.querySelectorAll('.bcard').forEach(function(c){
    c.addEventListener('click', function(){ openDetail(this.dataset.id); });
  });
  root.querySelectorAll('.save-btn').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      toggleSaved(this.dataset.id);
    });
  });
}

function getIds(key) {

    var arr = JSON.parse(window.localStorage.getItem(key) || '[]');
    if(!Array.isArray(arr)) return [];
    return arr.filter(function(v){ return /^\d+$/.test(String(v)); }).map(String);
  } catch(e) {
    return [];
  }
}

function setSavedIds(ids) {
  return setIds(SAVED_KEY, ids);
}

function setIds(key, ids) {
  try {
    window.localStorage.setItem(key, JSON.stringify(ids));
    return true;
  } catch(e) {
    return false;
  }
}

function isSaved(id) {
  return getSavedIds().indexOf(String(id)) >= 0;
}

function saveBtnHtml(id) {
  var on = isSaved(id);
  return '<button class="save-btn'+(on?' on':'')+'" data-id="'+esc(id)+'" aria-label="'+(on?'저장 해제':'저장')+'">'+
    '<i class="ti '+(on?'ti-star-filled':'ti-star')+'"></i></button>';
}

function toggleSaved(id) {
  if(!storageOk) { showToast('이 브라우저에서는 저장이 안 돼요'); return; }
  id = String(id);
  var ids = getSavedIds();
  var i = ids.indexOf(id);
  var on = i < 0;
  if(on) ids.unshift(id); else ids.splice(i, 1);
  if(!setSavedIds(ids)) { showToast('이 브라우저에서는 저장이 안 돼요'); return; }
  document.querySelectorAll('.save-btn[data-id="'+id+'"]').forEach(function(b){
    b.classList.toggle('on', on);
    b.setAttribute('aria-label', on ? '저장 해제' : '저장');
    b.querySelector('i').className = 'ti ' + (on ? 'ti-star-filled' : 'ti-star');
  });
  showToast(on ? '저장했어요' : '저장을 해제했어요');
  if(currentView === 'saved' && !on) renderSaved();
}

// 내가 올린 글 기록 (제출 성공 시)
function rememberMine(id) {
  if(!storageOk || !/^\d+$/.test(String(id))) return;
  var ids = getIds(MY_KEY).filter(function(x){ return x !== String(id); });
  ids.unshift(String(id));
  setIds(MY_KEY, ids.slice(0, 200));
}

function viewKey() {
  return currentView === 'mine' ? MY_KEY : SAVED_KEY;
}

function setView(v) {
  currentView = v;
  document.querySelector('.app').classList.toggle('view-list', v !== 'home');
  document.getElementById('navHome').classList.toggle('on', v === 'home');
  document.getElementById('navSaved').classList.toggle('on', v === 'saved');
  document.getElementById('navMine').classList.toggle('on', v === 'mine');
  document.querySelector('.scroll-area').scrollTop = 0;
  if(v === 'home') renderList(); else loadSaved();
}

function loadSaved() {
  var wrap = document.getElementById('listWrap');
  if(!storageOk) { renderSaved(); return; }
  var ids = getIds(viewKey());
  var view = currentView;
  if(!ids.length || !db) { savedItems = []; renderSaved(); return; }
  savedLoading = true;
  renderSaved();
  db.from('sms_benefits')
    .select('*')
    .in('id', ids)
    .eq('status','approved')
    .then(function(res){
      savedLoading = false;
      if(currentView !== view) return;
      if(res.error) {
        console.error('목록 오류:', res.error);
        wrap.innerHTML = '<div class="empty-state"><i class="ti ti-alert-circle"></i><p>목록을 불러오지 못했어요<br>잠시 후 다시 시도해주세요</p></div>';
        return;
      }
      savedItems = res.data || [];
      renderSaved();
    })
    .catch(function(e){
      savedLoading = false;
      console.error('네트워크 오류:', e);
      if(currentView !== view) return;
      wrap.innerHTML = '<div class="empty-state"><i class="ti ti-wifi-off"></i><p>네트워크 오류<br>인터넷 연결을 확인해주세요</p></div>';
    });
}

function renderSaved() {
  var wrap = document.getElementById('listWrap');
  var mine = currentView === 'mine';
  if(!storageOk) {
    wrap.innerHTML = '<div class="empty-state"><i class="ti ti-star-off"></i><p>이 브라우저에서는 저장이 안 돼요<br>사생활 보호 모드라면 일반 모드에서 열어주세요</p></div>';
    return;
  }
  if(savedLoading) {
    wrap.innerHTML = '<div class="empty-state"><i class="ti ti-loader"></i><p>불러오는 중...</p></div>';
    return;
  }
  // 저장한(올린) 순서대로, 조회되지 않은 id는 목록에서 제외
  var ids = getIds(viewKey());
  var byId = {};
  savedItems.forEach(function(d){ byId[String(d.id)] = d; });
  var items = ids.map(function(id){ return byId[id]; }).filter(Boolean);
  // 내가 올린 글 중 검토 대기·삭제로 안 보이는 개수는 알려줌
  var hiddenNote = mine && ids.length > items.length
    ? '<div class="list-note">확인 중이거나 삭제된 글 '+(ids.length - items.length)+'개는 보이지 않아요</div>' : '';
  if(!items.length) {
    wrap.innerHTML = mine
      ? '<div class="empty-state"><i class="ti ti-message-plus"></i><p>아직 올린 혜택이 없어요<br>받은 광고 문자를 올려보세요!</p></div>' + hiddenNote
      : '<div class="empty-state"><i class="ti ti-star"></i><p>저장한 혜택이 없어요<br>카드의 ☆를 눌러 저장해 보세요</p></div>';
    return;
  }
  var ongoing = items.filter(function(d){ return !isExpired(d.end_date) && hasEndDate(d); });
  var nodate = items.filter(function(d){ return !isExpired(d.end_date) && !hasEndDate(d); });
  var expired = items.filter(function(d){ return isExpired(d.end_date); });
  var html = secHead(mine ? '내가 올린 혜택' : '저장한 혜택', items.length, mine ? '최근 올린 순' : '최근 저장 순') +
    ongoing.concat(nodate, expired).map(function(d){ return cardHtml(d, -1); }).join('') + hiddenNote;
  wrap.innerHTML = html;
  bindCards(wrap);
}

    '<span class="brand-inline">'+esc(maskText(d.brand))+'</span> <span class="summary-inline">'+esc(maskText(d.summary))+'</span></div>'+
    '</div></div>'+

// 카테고리 정리 — AI·규칙 분석이 만든 비슷한 이름을 하나로
var CATEGORIES = ['음료/카페','편의점','배달앱','외식','패션/의류','뷰티/헬스','마트/쇼핑','금융/카드','통신','IT/앱','독서/교육','여행/숙박','OTT/구독','공공/기타','기타'];
var CAT_ALIAS = {'뷰티':'뷰티/헬스','헬스':'뷰티/헬스','배달':'배달앱','패션':'패션/의류','의류':'패션/의류','스포츠':'패션/의류','금융':'금융/카드','카드':'금융/카드','쇼핑':'마트/쇼핑','마트':'마트/쇼핑','생활용품':'마트/쇼핑','카페':'음료/카페','음료':'음료/카페','외식/패스트푸드':'외식','외식/치킨':'외식','외식/피자':'외식','교육':'독서/교육','독서':'독서/교육','여행':'여행/숙박','숙박':'여행/숙박','OTT':'OTT/구독','구독':'OTT/구독','공공':'공공/기타','IT':'IT/앱','앱':'IT/앱'};

function normCat(c) {
  c = String(c || '').trim();
  if(CATEGORIES.indexOf(c) >= 0) return c;
  if(CAT_ALIAS[c]) return CAT_ALIAS[c];
  return '기타';
}

function catLabel(c) {
  return c === '패션/의류' ? '패션' : c;
}

function renderChips(items) {
  var counts = {};
  items.forEach(function(d){ var c = normCat(d.category); counts[c] = (counts[c]||0) + 1; });
  var cats = CATEGORIES.filter(function(c){ return counts[c] || c === currentFilter; });
  cats.sort(function(a,b){
    if(a === '기타') return 1;
    if(b === '기타') return -1;
    return (counts[b]||0) - (counts[a]||0);
  });
  var html = '<span class="chip'+(currentFilter==='전체'?' on':'')+'" data-cat="전체">전체<span class="cnt">'+items.length+'</span></span>';
  cats.forEach(function(c){
    html += '<span class="chip'+(currentFilter===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(catLabel(c))+'<span class="cnt">'+(counts[c]||0)+'</span></span>';
  });
  document.getElementById('filterRow').innerHTML = html;
}

// 혜택 크기 뽑기 — 요약에서 먼저, 없으면 원문에서 키워드가 붙은 것만
function getPerk(d) {
  return perkFrom(maskText(d.summary), false) || perkFrom(maskText(d.raw_sms), true);
}

function perkFrom(t, strict) {
  t = String(t || '');
  if(!t) return null;
  var m = t.match(/(?:^|[^\d.])(\d{1,2})\s*\+\s*(\d{1,2})(?![\d%])/);
  if(m && +m[1] >= 1 && +m[2] >= 1 && +m[1] <= 10 && +m[2] <= 10) return { kind:'plus', value:m[1]+'+'+m[2], label:'증정' };
  m = strict ? t.match(/(\d{1,2}(?:\.\d+)?)\s*%\s*(할인|적립|캐시백|쿠폰|페이백|세일|OFF|off)/)
             : t.match(/(\d{1,2}(?:\.\d+)?)\s*%\s*([가-힣A-Za-z]*)/);
  if(m) {
    var rateCtx = /연\s*$|금리|이율|이자/.test(t.slice(Math.max(0, m.index-4), m.index)) || /금리|이자|적금|예금/.test(m[2]||'');
    return { kind:'pct', value:m[1]+'%', label: rateCtx ? '금리' : perkLabel(m[2], '할인') };
  }
  // '1만원 이상 결제 시'처럼 조건 금액이나 '2만원대' 가격은 건너뜀
  var wonRe = strict ? /(\d[\d,]*(?:\.\d+)?)\s*(억|만|천)?\s*원\s*(할인|쿠폰|적립|캐시백|지원|증정|상당|페이백|지급|혜택)/g
                     : /(\d[\d,]*(?:\.\d+)?)\s*(억|만|천)?\s*원\s*([가-힣]*)/g;
  while((m = wonRe.exec(t))) {
    if(/^(이상|이하|미만|초과|대|당|부터|결제|구매|이용)/.test(m[3] || '') || /^\s*(이상|이하|미만|초과)/.test(t.slice(m.index + m[0].length))) continue;
    var n = parseFloat(m[1].replace(/,/g,'')) * (m[2]==='억'?100000000:m[2]==='만'?10000:m[2]==='천'?1000:1);
    if(n >= 100) return { kind:'won', value:fmtWon(n), label:perkLabel(m[3], '혜택') };
  }
  m = t.match(/무료\s*(배송|체험|증정|이용|제공|쿠폰|진단|상담|수강|가입|입장|주차|세미나)?(?!\s*(?:수신|거부|전화|상담전화))/);
  if(m && (!strict || m[1]) && !/무료\s*(수신|거부)/.test(t.slice(m.index, m.index + 8))) return { kind:'free', value:'무료', label:m[1] || '혜택' };
  if(!strict && /증정|사은품|기프트|드립니다/.test(t)) return { kind:'free', value:'증정', label:'사은품' };
  return null;
}

function perkLabel(word, def) {
  var w = String(word || '');
  var keys = ['할인','적립','캐시백','쿠폰','페이백','지원','증정','지급','세일'];
  for(var i=0; i<keys.length; i++) if(w.indexOf(keys[i]) === 0) return keys[i];
  if(/^off$/i.test(w)) return '할인';
  return def;
}

function fmtWon(n) {
  if(n >= 100000000) return (Math.round(n/10000000)/10) + '억원';
  if(n >= 10000) return (Math.round(n/1000)/10) + '만원';
  return Math.round(n).toLocaleString() + '원';
}

// 혜택별 링크 (?id=123) — 열면 그 혜택의 상세 화면으로
function itemUrl(id) {
  return location.origin + location.pathname + '?id=' + encodeURIComponent(id);
}

function shareItem() {
  var d = currentDetail;
  var url = d ? itemUrl(d.id) : location.origin + location.pathname;
  var title = d ? maskText(d.brand) + ' ' + maskText(d.summary) : '문자혜택';
  if(navigator.share) {
    navigator.share({ title: title, text: title + ' - 문자혜택', url: url }).catch(function(){});
    return;
  }
  copyText(url, function(ok){ showToast(ok ? '링크 복사됐어요' : '링크를 복사하지 못했어요'); });
}

function copyText(text, done) {
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallbackCopy(text)); });
  } else {
    done(fallbackCopy(text));
  }
}

function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) {
    return false;
  }
}

async function callGeminiAPI(smsText) {
  console.log('Edge Function 호출 시작...');
  var prompt = '너는 한국 광고 SMS 전문 분석가야.\n\n아래 SMS를 읽고 brand, category, summary, end_date, location, trust_score, is_fake 를 JSON으로만 추출해줘. JSON 외 다른 텍스트 절대 출력하지 마.\n\nSMS:\n' + smsText + '\n\n추출 규칙:\n- brand: 문자를 보낸 실제 업체명. [대괄호]안 텍스트가 업체명이면 그대로 사용. 단 Web발신/광고는 제외. 없으면 알수없음\n- category: 음료/카페, 편의점, 배달앱, 패션/의류, 뷰티/헬스, 마트/쇼핑, 금융/카드, 통신, 외식, 여행/숙박, 독서/교육, OTT/구독, 공공/기타, 기타 중 하나\n- summary: 이 문자의 핵심 혜택이나 제안을 20자 이내로. 도입부/인사말 제외하고 실제 혜택이나 행동유도 내용\n- end_date: YYYY-MM-DD 형식. 없으면 null\n- location: 특정 지역명 또는 앱전용 또는 온라인 또는 전국\n- trust_score: 0~100\n- is_fake: true 또는 false\n\nJSON만 출력:';

  var seq = ++analyzeSeq;
  try {
    var res = await fetch(
      'https://zillfttfqjfvztecmdpx.supabase.co/functions/v1/hyper-processor',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY
        },
        body: JSON.stringify({ smsText: smsText })
      }
    );
    if(!res.ok) throw new Error('오류 ' + res.status);
    var parsed = await res.json();
    if(parsed.error) throw new Error(parsed.error);
    if(seq !== analyzeSeq) return;
    console.log('Edge Function 결과:', parsed);
    document.getElementById('analyzing').classList.remove('show');
    showAIResult(parsed);
  } catch(e) {
    if(seq !== analyzeSeq) return;
    // AI 분석 실패 시 규칙 기반 분석으로 대체
    console.error('Gemini 오류, 기본 분석으로 대체:', e);
    document.getElementById('analyzing').classList.remove('show');
    showAIResult(ruleBasedAnalysis(smsText));
    showToast('AI 연결이 불안정해 기본 분석 결과를 보여드려요');
  }
}

    .replace(/https?:\/\/\S+/g, '')
    .replace(/\d{2,4}-\d{3,4}-\d{4}/g, '')
    .replace(/무료수신거부.*$/g, '')
    .trim();

  // 패턴 1: 숫자+단위 혜택 (1+1, 50% 할인, 3000원 할인 등)
  var benefitPatterns = [
    /최대\s*연\s*[\d.]+%[^,。\n]{0,15}/,
    /연\s*[\d.]+%[^,。\n]{0,10}/,
    /\d+\+\d+/,
    /\d+%\s*(?:할인|캐시백|적립|off)/,
    /\d+만?\s*원\s*(?:할인|쿠폰|즉시할인|적립)/,
    /무료\s*(?:배송|쿠폰|증정|이용|제공)/,
    /(?:최대|최고)\s*\d+%/,
    /[가-힣]+\s*\d+(?:개월|회|박)\s*[가-힣]+\s*\d+(?:개월|회|박)\s*(?:추가|제공|무료)/,
    /[가-힣]+\s*\d+(?:개월|회)\s*(?:등록|가입)[^,。\n]{0,10}/,
  ];
  for(var p=0; p<benefitPatterns.length; p++) {
    var bm = cleanText.match(benefitPatterns[p]);
    if(bm) {
      summary = bm[0].replace(/\s+/g,' ').trim();
      if(summary.length > 25) summary = summary.substring(0,25);
      break;
    }
  }

  // 패턴 2: 이벤트/혜택 문장 추출 — 번호 매긴 목록 첫 번째 항목
  if(!summary) {
    var listMatch = cleanText.match(/1[.\)、]\s*([^\n!！]{3,30})/);
    if(listMatch) summary = listMatch[1].trim().substring(0,25);
  }

  // 패턴 3: 클린 텍스트 첫 문장
  if(!summary) {
    var firstLine = cleanText.split(/[!！\n。]/)[0].trim();
    if(firstLine.length > 3) summary = firstLine.substring(0,25);
  }

  // ---
  var endDate = null;
  var now2 = new Date();
  var year2 = now2.getFullYear();
  var datePatterns = [
    { re:/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/, fn:function(m){ return m[1]+'-'+pad(m[2])+'-'+pad(m[3]); }},
    { re:/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/, fn:function(m){ return m[1]+'-'+pad(m[2])+'-'+pad(m[3]); }},
    { re:/(\d{1,2})월\s*(\d{1,2})일/, fn:function(m){ return year2+'-'+pad(m[1])+'-'+pad(m[2]); }},
    { re:/~\s*(\d{1,2})[\/\.](\d{1,2})/, fn:function(m){ return year2+'-'+pad(m[1])+'-'+pad(m[2]); }},
    { re:/(\d{1,2})[\/\.](\d{1,2})\s*까지/, fn:function(m){ return year2+'-'+pad(m[1])+'-'+pad(m[2]); }},
    { re:/(\d{1,2})월말/, fn:function(m){ return year2+'-'+pad(m[1])+'-28'; }},
  ];
  for(var dp=0; dp<datePatterns.length; dp++) {
    var dm = text.match(datePatterns[dp].re);
    if(dm) { endDate = datePatterns[dp].fn(dm); break; }
  }

  // ---
  var location = '전국';
  if(/앱\s*(전용|한정|only)/i.test(text) || text.includes('앱에서') || text.includes('앱 쿠폰')) location = '앱전용';
  else if(text.includes('온라인') || text.includes('홈페이지')) location = '온라인';
  else {
    var locMatch2 = text.match(/([가-힣]{2,5}[시군구])\s|([가-힣]{2,5}점)\s/);
    if(locMatch2) location = (locMatch2[1]||locMatch2[2]).trim();
  }

  // ---
  // 기준: 브랜드 인식(+30) 혜택요약(+20) 유효기간(+15) 발신자확인(+10) 지역명시(+5)
  // 감점: 비현실적할인(-40) 개인정보요구(-30) 공공기관(-10) 너무짧음(-20)
  var score = 20;
  if(brand && brand !== '알수없음') score += 30;
  if(summary && summary.length > 3) score += 20;
  if(endDate) score += 15;
  if(rawSender && rawSender.length >= 2) score += 10;
  if(location !== '전국') score += 5;
  if(/100%\s*무료|전부\s*공짜|완전\s*무료/.test(text)) score -= 40;
  if(/개인정보|비밀번호|계좌번호/.test(text)) score -= 30;
  if(category === '공공/기타') score -= 10;
  if(text.length < 15) score -= 20;
  score = Math.max(5, Math.min(100, score));

  return { brand:brand, category:category, summary:summary, end_date:endDate, location:location, trust_score:score, is_fake:score<20 };
}

var submitDone = false;

function doSubmit() {
  if(submitDone) { closeSheet(); return; }
  if(!aiResult) return;
  var sms = maskText(document.getElementById('smsTA').value.trim());
  var btn = document.getElementById('submitOk');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  var item = {
    brand: aiResult.brand,
    category: aiResult.category,
    summary: aiResult.summary,
    raw_sms: sms,
    end_date: aiResult.end_date || null,
    location: aiResult.location,
    trust_score: aiResult.trust_score,
    status: 'approved',
    submit_count: 1
  };

  if(db) {
    db.rpc('upsert_sms_benefit', {
      p_brand: aiResult.brand,
      p_category: aiResult.category,
      p_summary: aiResult.summary,
      p_raw_sms: sms,
      p_end_date: aiResult.end_date || null,
      p_location: aiResult.location,
      p_trust_score: aiResult.trust_score
    })
      .then(function(res){
        if(res.error) {
          console.error('Supabase 저장 오류:', res.error);
          showToast('저장 오류: ' + res.error.message);
          btn.disabled = false;
          btn.textContent = '다시 시도하기';
          return;
        }
        console.log('저장 성공:', res.data);
        if(res.data && res.data.id) rememberMine(res.data.id);
        onSubmitDone(res.data);
      })
      .catch(function(e){
        console.error('네트워크 오류:', e);
        showToast('네트워크 오류가 생겼어요. 다시 시도해주세요.');
        btn.disabled = false;
        btn.textContent = '다시 시도하기';
      });
  } else {
    item.id = Date.now();
    allItems.unshift(item);
    onSubmitDone();
  }
}

// saved: 저장 함수가 돌려준 글 (status: approved/pending, duplicate: 이미 있던 문자인지)
function onSubmitDone(saved) {
  var btn = document.getElementById('submitOk');
  var pending = saved && saved.status === 'pending';
  var dup = saved && saved.duplicate === true;
  var btnText = '제출 완료! 리스트에 추가됐어요';
  var toast = '혜택이 등록됐어요!';
  if(pending) {
    btnText = '제출 완료! 확인 후 공개돼요';
    toast = dup ? '이미 확인 중인 문자예요' : '확인 후 공개돼요';
  } else if(dup) {
    btnText = '이미 등록된 혜택이에요';
    toast = '이미 등록된 혜택이에요 · ' + (Number(saved.submit_count) || 2) + '명째 제출';
  }
  btn.textContent = btnText;
  btn.style.background = '#085041';
  // 검토 대기 글은 공개 목록에서 찾을 수 없어 같은 행사 섹션을 보여주지 않고 닫음
  if(pending || !saved || !saved.id) {
    setTimeout(function(){
      closeSheet();
      showToast(toast);
      fetchData();
    }, 1000);
    return;
  }
  var seq = sameEventSeq;
  setTimeout(function(){
    if(seq !== sameEventSeq) return;
    showToast(toast);
    fetchData();
    submitDone = true;
    btn.disabled = false;
    btn.textContent = '닫기';
    loadSameEvent(document.getElementById('sheetSameEvent'), saved.id, function(){ return seq === sameEventSeq; }, true);
  }, 1000);
}

// ---- 같은 행사에서 사람들이 받은 혜택 (RPC get_same_event_benefits)
var sameEventSeq = 0;

function hideSameEvent(box) {
  if(!box) return;
  box.style.display = 'none';
  box.innerHTML = '';
}

// stillValid: 응답이 왔을 때 아직 같은 화면인지 확인. 실패하면 오류 없이 섹션만 숨김
function loadSameEvent(box, id, stillValid, fromSheet) {
  hideSameEvent(box);
  if(!box || !db || !/^\d+$/.test(String(id))) return;
  db.rpc('get_same_event_benefits', { p_id: Number(id) })
    .then(function(res){
      if(!stillValid()) return;
      if(res.error || !Array.isArray(res.data)) { hideSameEvent(box); return; }
      box.innerHTML = sameEventHtml(res.data);
      box.style.display = 'block';
      box.querySelectorAll('.se-row').forEach(function(r){
        r.addEventListener('click', function(){
          var rid = this.dataset.id;
          if(!allItems.some(function(i){ return String(i.id) === rid; })) return;
          if(fromSheet) closeSheet();
          openDetail(rid);
        });
      });
    })
    .catch(function(){
      if(stillValid()) hideSameEvent(box);
    });
}

function sameEventHtml(rows) {
  var head = '<div class="se-head"><span class="se-title">같은 행사에서 사람들이 받은 혜택</span>'+
    (rows.length ? '<span class="se-cnt">'+rows.length+'</span>' : '')+'</div>';
  if(!rows.length) {
    return '<div class="se-box">'+head+'<div class="se-empty">이 행사의 첫 제보예요. 같은 행사 문자를 받은 분이 올리면 여기에 모여요.</div></div>';
  }
  return '<div class="se-box">'+head+rows.map(function(r){
    var end = hasEndDate(r) ? '~'+fmtDate(r.end_date)+(isExpired(r.end_date)?' · 마감':'') : '기간 미정';
    return '<div class="se-row" data-id="'+esc(r.id)+'"><div class="se-txt">'+
      '<div class="se-sum">'+esc(maskText(r.summary) || maskText(r.brand))+'</div>'+

      '<span><i class="ti ti-calendar"></i>'+esc(end)+'</span></div>'+
      '</div><i class="ti ti-chevron-right"></i></div>';
  }).join('')+'</div>';
}

// 개인정보 마스킹 — 이름, 계좌/카드/주민번호, 쿠폰·인증번호, 휴대폰, 이메일
var NAME_SURNAMES = '김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구민진나지엄변채원천방공현함염여추도석소설선마길위표명기반왕금옥육인맹제모탁국어은편용예봉경';
var NAME_STOPWORDS = ['고객','회원','모든','오직','포장','애독자','여러분','가족','손님','주주','부모','선생','사장','원장','대표','관리자','담당자','이용자','가입자','입주민','학부모','소중한','우수','신규','기존','전체','당첨자','구매자','방문','이용','고객센터','회원가입','사업자','본인','고객분','회원분','저축은행','신한','국민','우리','하나','농협'];

function looksLikeName(w) {
  if(w.length === 4) {
    if(!/^(남궁|황보|제갈|선우|독고|사공|서문)/.test(w)) return false;
  } else if(NAME_SURNAMES.indexOf(w.charAt(0)) < 0) return false;
  // 조사·어미로 끝나는 말(위해서는, 고객의 등)과 지명(김해시 등) 제외
  if(/[는을를의에도로서시군읍면점]$/.test(w)) return false;
  for(var i=0; i<NAME_STOPWORDS.length; i++) {
    if(w.indexOf(NAME_STOPWORDS[i]) >= 0) return false;
  }
  return true;
}

function maskDigits(s) {
  return s.replace(/[A-Za-z0-9]/g, '*');
}

function maskPII(text) {
  var counts = {};
  function hit(k){ counts[k] = (counts[k]||0) + 1; }
  var t = String(text == null ? '' : text);

  // 주민등록번호
  t = t.replace(/\d{6}\s?-\s?[1-4]\d{6}/g, function(){ hit('주민번호'); return '******-*******'; });
  // 이메일
  t = t.replace(/[\w.+-]+@([\w-]+\.[\w.]+)/g, function(m, dom){ hit('이메일'); return '***@'+dom; });
  // 계좌·카드·회원·쿠폰·인증번호 등 — 키워드 뒤의 번호
  t = t.replace(/(계좌번호|계좌|카드번호|회원번호|고객번호|주문번호|예약번호|쿠폰번호|쿠폰코드|할인코드|프로모션코드|바우처|시리얼|일련번호|인증번호|인증코드|인증|PIN|핀번호)(\s*[:：]?\s*\[?\s*)([A-Za-z0-9][A-Za-z0-9-]{3,})/gi, function(m, kw, sep, code){
    if(!/\d/.test(code)) return m;
    hit(/계좌/.test(kw) ? '계좌번호' : /카드/.test(kw) ? '카드번호' : '쿠폰·인증번호');
    return kw + sep + maskDigits(code);
  });
  // COUPON-1234 형태의 코드
  t = t.replace(/\b(COUPON|CPN|CODE)-[A-Za-z0-9-]{4,}/gi, function(m){
    if(/^[A-Za-z]+-\*+$/.test(m)) return m;
    hit('쿠폰·인증번호'); return m.split('-')[0] + '-' + maskDigits(m.slice(m.indexOf('-')+1));
  });
  // 휴대폰 번호: 가운데 자리 가림
  t = t.replace(/(01[016789])([-.\s]?)(\d{3,4})([-.\s]?)(\d{4})(?!\d)/g, function(m, a, s1, mid, s2, end){
    hit('휴대폰'); return a + s1 + '****' + s2 + end;
  });
  // 12자리 이상 숫자 (카드·계좌 등)
  t = t.replace(/(?:\d[-\s]?){12,19}(?!\d)/g, function(m, offset, str){
    if(!/\d{4}/.test(m)) return m;
    // 링크 주소 안의 숫자는 제외
    if(/\S*[\/=?&#.]$/.test(str.slice(Math.max(0, offset-1), offset)) || /[a-z0-9-]\.[a-z]{2,}\/\S*$/i.test(str.slice(Math.max(0, offset-80), offset))) return m;
    hit('카드·계좌번호'); return m.replace(/\d/g, '*');
  });
  // 이미 일부 가려진 이름 (채*수)
  t = t.replace(/([가-힣])\*([가-힣])(?=\s*(?:님|고객|회원))/g, function(){ hit('이름'); return '○○○'; });
  // 이름 + 님/고객님/회원님/께
  t = t.replace(/(^|[^가-힣])([가-힣]{2,4}?)(\s?)(고객님|회원님|님|께서|께)/g, function(m, pre, w, sp, suf){
    if(!looksLikeName(w)) return m;
    if(w.length === 2 && !/고객님|회원님/.test(suf)) return m;
    hit('이름'); return pre + '○○○' + sp + suf;
  });

  return { text: t, counts: counts };
}

function piiNoteHtml(counts) {
  var parts = [];
  for(var k in counts) parts.push(k + ' ' + counts[k] + '건');
  if(!parts.length) return '';
  return '<div class="pii-note"><i class="ti ti-lock"></i><span>개인정보를 가리고 저장해요: ' + esc(parts.join(', ')) + '</span></div>';
}

// 원문 속 링크를 한 줄씩 누를 수 있게 — http(s)만 허용
function extractLinks(text) {
  var t = String(text || '');
  var re = /(?:https?:\/\/)?(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:com|net|org|kr|me|io|ly|gl|us|co|app|shop|link|info|biz|page|to|so|im|kakao)(?![a-z0-9-])(?:\/[^\s<>"'()\[\]{}가-힣]*)?(?:\*+\S*)?/gi;
  var out = [], seen = {}, m;
  while((m = re.exec(t))) {
    var prev = t.charAt(m.index - 1);
    if(prev === '@' || /[a-z0-9.\/]/i.test(prev)) continue;  // 이메일, 다른 주소의 일부
    var u = m[0].replace(/[.,;:!?~·…]+$/, '');
    if(u.indexOf('*') >= 0) continue;  // 주소 일부가 가려진 링크는 열리지 않으므로 제외
    if(!/[a-z]/i.test(u.split('/')[0].replace(/^https?:\/\//i, '').replace(/\.[a-z]+$/i, ''))) continue;
    var href = /^https?:\/\//i.test(u) ? u : 'https://' + u;
    var key = href.replace(/^https?:\/\//i, '').replace(/\/$/, '').toLowerCase();
    if(seen[key]) continue;
    seen[key] = 1;
    out.push({ href: href, host: href.replace(/^https?:\/\//i, '').split(/[\/?#]/)[0], text: u });
  }
  return out;
}

function linksHtml(d) {
  var links = extractLinks(maskText(d.raw_sms));
  if(!links.length) return '';
  var low = d.trust_score < 50;
  return '<div class="links-box"><div class="links-head"><span class="links-title">관련 링크</span><span class="links-cnt">'+links.length+'</span></div>'+
    links.map(function(l){
      return '<a class="link-row" href="'+esc(l.href)+'" target="_blank" rel="noopener noreferrer nofollow">'+
        '<i class="ti ti-link"></i><span class="link-txt"><span class="link-host">'+esc(l.host)+'</span><span class="link-url">'+esc(l.text)+'</span></span>'+
        '<i class="ti ti-external-link"></i></a>';
    }).join('')+
    '<div class="links-warn'+(low?' bad':'')+'"><i class="ti ti-alert-triangle"></i><span>'+
    (low ? '신뢰도가 낮은 문자예요. 링크에서 개인정보나 결제 정보를 입력하지 마세요.'
         : '문자에 들어 있던 링크예요. 주소가 공식 사이트인지 확인하고 들어가세요.')+
    '</span></div></div>';
}

function maskText(s) {
  return maskPII(s).text;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// 마감일이 있는지 (비어 있거나 날짜로 읽을 수 없으면 '기간 미정')
function hasEndDate(d) {
  return !!(d && d.end_date) && !isNaN(parseLocalDate(d.end_date));
}

// 'YYYY-MM-DD'를 UTC가 아닌 기기 시간대의 그날 0시로 읽음 (new Date('YYYY-MM-DD')는 UTC 0시 = 한국 오전 9시)
function parseLocalDate(ds) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ds || ''));
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(ds);
}

function isExpired(ds) {
  if(!ds) return false;
  var end = parseLocalDate(ds);
  if(isNaN(end)) return false;
  end.setHours(23,59,59,999);
  return end < new Date();
}

// 남은 날짜 수 (오늘 마감 = 0), 지났으면 null
function calcDday(ds) {
  if(!ds) return null;
  var end = parseLocalDate(ds);
  if(isNaN(end)) return null;
  var today = new Date();
  today.setHours(0,0,0,0);
  var d = Math.round((end - today)/(1000*60*60*24));
  return d>=0?d:null;
}

function fmtDate(ds) {
  if(!ds) return '미확인';
  var d = parseLocalDate(ds);
  return (d.getMonth()+1)+'/'+(d.getDate());
}

var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

window.addEventListener('DOMContentLoaded', init);
</script>
